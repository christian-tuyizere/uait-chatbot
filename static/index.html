<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f913b"><meta name="color-scheme" content="light dark">
<title>UAIT AI Assistant</title>
<link rel="icon" href="/static/uait-logo.png">
<link rel="stylesheet" href="/static/styles.css?v=18">
<script>try{var t=/[?&]theme=(light|dark)\b/.exec(location.search);if(t)document.documentElement.setAttribute("data-theme",t[1])}catch(e){}try{var m=/[?&]fs=(\d{2})\b/.exec(location.search);if(m&&+m[1]>=12&&+m[1]<=24)document.documentElement.style.setProperty("--fs",m[1]+"px")}catch(e){}</script>
</head>
<body>
<div class="app">
  <header class="bar">
    <a class="brand" href="/" aria-label="UAIT AI">
      <span class="logo-chip"><img src="/static/uait-logo.png" alt="UAIT" class="logo"></span>
      <span class="brand-text"><strong data-i18n="title"></strong><span class="status"><i id="dot" class="dot"></i><span id="status"></span></span></span>
    </a>
    <div class="bar-actions">
      <div class="seg" role="group" aria-label="Language">
        <button type="button" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" data-lang="ko" aria-pressed="false">한국어</button>
      </div>
      <button id="newChat" class="icon-btn" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="sr" data-i18n="newChat"></span></button>
      <button id="closeBtn" class="icon-btn" type="button" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg><span class="sr" data-i18n="close"></span></button>
    </div>
  </header>

  <main id="chat" class="chat" role="log" aria-live="polite">
    <section id="welcome" class="welcome">
      <div class="hero-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 3l1.9 5.6L18.5 10.5 12.9 12.4 11 18l-1.9-5.6L3.5 10.5 9.1 8.6z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8z"/></svg></div>
      <h1 data-i18n="h1"></h1>
      <p class="lead" data-i18n="intro"></p>
      <div class="cards" id="cards"></div>
    </section>
    <div id="messages" class="messages"></div>
  </main>

  <div class="dock">
    <div id="chips" class="chips" aria-label="Suggested questions"></div>
    <form id="form" class="composer">
      <label class="sr" for="input" data-i18n="ask"></label>
      <textarea id="input" rows="1" maxlength="2000" required></textarea>
      <button id="send" class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>
    <p class="fine" data-i18n="disclaimer"></p>
  </div>
</div>
<script src="/static/app.js?v=18" defer></script>
</body></html>
